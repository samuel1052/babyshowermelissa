<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Shower Melissa - Lista de Regalos</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
    h1 { color: #5b6577; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 280px; padding: 15px; text-align: left; position: relative; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    .card h3 { margin: 10px 0 5px; color: #333; }
    .card p { color: #666; font-size: 0.9em; }
    .btn-reservar { background: #4caf50; color: white; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-reservar:hover { background: #45a049; }
    .reservado { background: #e0e0e0; color: #777; }
    .badge { background: #ff5722; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; display: inline-block; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Baby Shower de Melissa 🍼👶</h1>
  <p>¡Elige el regalo que te gustaría hacernos!</p>

  <div id="contenedor-regalos" class="grid">Cargando regalos...</div>

  <script>
    // Tu número de WhatsApp con código de país (ejemplo de España +34)
    const TU_WHATSAPP = "34600000000"; 

    fetch('regalos.json')
      .then(response => response.json())
      .then(regalos => {
        const contenedor = document.getElementById('contenedor-regalos');
        contenedor.innerHTML = '';

        regalos.forEach(regalo => {
          const tarjeta = document.createElement('div');
          tarjeta.className = 'card';

          let botonOEstado = '';
          if (regalo.reservado) {
            botonOEstado = `<span class="badge">Reservado por ${regalo.reservadoPor}</span>`;
          } else {
            const mensaje = encodeURIComponent(`¡Hola! Me gustaría reservar el regalo: ${regalo.nombre} para el Baby Shower.`);
            const urlWhatsapp = `https://wa.me/${TU_WHATSAPP}?text=${mensaje}`;
            botonOEstado = `<a href="${urlWhatsapp}" target="_blank" style="text-decoration:none;"><button class="btn-reservar">Reservar este regalo</button></a>`;
          }

          tarjeta.innerHTML = `
            <img src="${regalo.imagen}" alt="${regalo.nombre}">
            <h3>${regalo.nombre}</h3>
            <p>${regalo.descripcion}</p>
            ${botonOEstado}
          `;

          contenedor.appendChild(tarjeta);
        });
      });
  </script>
</body>
</html>
